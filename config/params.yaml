table_person_association:
  ros__parameters:
    mask_topic: "/sam2_segmentation_node/binary_mask/compressed"
    pointcloud_topic: "/livox/lidar"
    camera_info_topic: "/camera/camera_head/color/camera_info"
    filtered_cloud_topic: "/segmented_lidar/points"
    centers_topic: "/segmented_lidar/cluster_centers"
    clustered_cloud_topic: "/segmented_lidar/clustered_points"
    markers_topic: "/segmented_lidar/cluster_markers"
    action_name: "associate_cluster"
    camera_frame: ""
    mask_threshold: 0
    cluster_tolerance: 0.30
    min_cluster_size: 8
    max_cluster_size: 30000
    input_timeout_sec: 1.0
    lidar_frame_timeout_sec: 1.0
    max_decay_frames: 100
    decay_num: 5
    max_distance: 0.7
    tf_timeout_sec: 0.1

local_search:
  ros__parameters:
    mask_topic: "/sam2_segmentation_node/binary_mask/compressed"
    pointcloud_topic: "/approach/submap_cloud"
    camera_info_topic: "/camera/camera_head/color/camera_info"
    bbox_topic: "/detection/bbox_stream"
    odom_topic: "/odom"
    filtered_cloud_topic: "~/points"
    centers_topic: "~/cluster_centers"
    clustered_cloud_topic: "~/clustered_points"
    markers_topic: "~/cluster_markers"
    diagnostics_topic: "~/frame_diagnostics"
    action_name: "local_search"
    camera_frame: "camera_head_color_optical_frame"
    map_frame: "map"
    mask_threshold: 0
    cluster_tolerance: 0.30
    min_cluster_size: 3
    max_cluster_size: 3000
    input_sync_queue_size: 10
    input_sync_slop_sec: 0.2
    tf_timeout_sec: 0.2
    require_stable_odom: true
    odom_stable_window_sec: 0.3
    odom_stable_timeout_sec: 1.0
    max_relative_angular_velocity_rad_s: 0.20
    odom_buffer_size: 200
    prefilter_cloud: true
    prefilter_frame: "base"
    prefilter_x_min: 0.5
    prefilter_x_max: 5.0
    prefilter_y_min: -2.0
    prefilter_y_max: 2.0
    prefilter_z_min: 0.3
    prefilter_z_max: 1.5
    submap_timeout_sec: 3.0
    max_distance_from_reference_m: 1.5
    ekf_enabled: true
    ekf_timeout_sec: 10.0
    ekf_converged_variance: 0.01
    ekf_initial_variance: 1.0
    ekf_measurement_variance: 0.09
    ekf_process_variance_per_sec: 0.0025
    ekf_log_enabled: true
    ekf_log_dir: "EKF_results"

local_search_logger:
  ros__parameters:
    mask_topic: "/sam2_segmentation_node/binary_mask/compressed"
    matched_cloud_topic: "/local_search/points"
    camera_info_topic: "/camera/camera_head/color/camera_info"
    diagnostics_topic: "/local_search/frame_diagnostics"
    camera_frame: "camera_head_color_optical_frame"
    output_dir: "/home/nvidia/inha_log/module/local_search"
    artifact_wait_sec: 0.5
    tf_timeout_sec: 0.2
    cache_size: 300
    point_radius_px: 2
    save_matched_cloud: true
